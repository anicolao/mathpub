name: CI Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-26
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14

      - name: Nix Flake Check
        run: nix flake check

      - name: Run Test Suite (Unit & E2E Visual Tests)
        run: |
          nix develop --command bash -c "PYTHONPATH=\$PWD:\$PWD/src:\$PYTHONPATH pytest tests/"

      - name: Upload Visual Regression Diffs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-diffs
          path: tests/e2e/**/diffs/
          if-no-files-found: ignore

  native-gui:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14

      - name: Run Packaged Tauri E2E
        run: nix run .#mathpub-gui-e2e

      - name: Upload Native Workspace Screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-workspace-screenshot
          path: build/e2e/tauri-driver.png
          if-no-files-found: ignore
